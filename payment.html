<!DOCTYPE html>
<html>
  <head>
    <title>Apni Dukaan</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./static/style.css">
    <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">

<body>
    <!-- Keep your navbar and content exactly as before -->
    <!-- ↓ Only the Buy Now button logic updated below ↓ -->

    <section class="py-5" style="background-color: #f7f9fc;">
  <div class="container">
    <div class="row justify-content-center">

      <!-- Payment Method Section -->
      <div class="col-md-7 mb-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">💳 Select a Payment Method</h4>
          </div>
          <div class="card-body p-4">
            <form>
              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="paymentMethod" id="cardOption">
                <label class="form-check-label" for="cardOption">
                  <strong>Debit/Credit Card</strong> — Visa, MasterCard, RuPay
                </label>
                <div id="cardDetails" class="mt-3 ps-4 d-none">
                  <input type="text" class="form-control mb-2" placeholder="Card Number">
                  <div class="row g-2">
                    <div class="col">
                      <input type="text" class="form-control" placeholder="Name on Card">
                    </div>
                    <div class="col-4">
                      <input type="text" class="form-control" placeholder="MM/YY">
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="paymentMethod" id="upiOption">
                <label class="form-check-label" for="upiOption">
                  <strong>UPI</strong> — Google Pay, PhonePe, Paytm
                </label>
                <div id="upiDetails" class="mt-3 ps-4 d-none">
                  <input type="text" class="form-control" placeholder="yourname@upi">
                </div>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="paymentMethod" id="netBankingOption">
                <label class="form-check-label" for="netBankingOption">
                  <strong>Net Banking</strong>
                </label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="paymentMethod" id="codOption">
                <label class="form-check-label" for="codOption">
                  <strong>Cash on Delivery</strong>
                </label>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Summary Section -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-success text-white text-center">
            <h4 class="mb-0">🧾 Order Summary</h4>
          </div>
          <div class="card-body">
            <p class="text-success"><i class="fa fa-check-circle"></i> Eligible for FREE Delivery</p>
            <hr>
            <div class="d-flex justify-content-between">
              <span>Item Total:</span>
              <strong>₹ 40,000</strong>
            </div>
            <div class="d-flex justify-content-between mt-2">
              <span>Taxes & Charges:</span>
              <strong>₹ 100</strong>
            </div>
            <hr>
            <div class="d-flex justify-content-between">
              <span><strong>To Pay:</strong></span>
              <strong style="font-size: 1.3rem;">₹ 41,000</strong>
            </div>
            <div class="text-center mt-4">
              <button id="rzp-button1" class="btn btn-primary btn-lg w-100">Proceed to Pay</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<script>
  // Toggle payment input visibility
  const cardOption = document.getElementById('cardOption');
  const upiOption = document.getElementById('upiOption');
  const cardDetails = document.getElementById('cardDetails');
  const upiDetails = document.getElementById('upiDetails');

  cardOption.addEventListener('click', () => {
    cardDetails.classList.remove('d-none');
    upiDetails.classList.add('d-none');
  });
  upiOption.addEventListener('click', () => {
    upiDetails.classList.remove('d-none');
    cardDetails.classList.add('d-none');
  });
</script>

    <!-- Razorpay Integration -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      document.getElementById('rzp-button1').onclick = function (e) {
        e.preventDefault();
        var totalAmount = 41000; // example total
        var options = {
          "key": "rzp_test_1DP5mmOlF5G5ag", // ✅ Razorpay official test key
          "amount": totalAmount * 100, // amount in paise
          "currency": "INR",
          "name": "Apni Dukaan",
          "description": "Demo Order Payment",
          "image": "./Images/Logo/ApniDukan.png",
          "handler": function (response) {
            alert("✅ Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
            window.location.href = "payment_receipt.html?payment_id=" + response.razorpay_payment_id;
          },
          "prefill": {
            "name": "Apni Dukaan Customer",
            "email": "user@example.com",
            "contact": "9999999999"
          },
          "theme": {
            "color": "#2980b9"
          }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
      };
    </script>
  </body>
</html>
