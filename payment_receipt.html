<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Receipt - Apni Dukaan</title>

  <!-- Optional: Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/style.css">

  <style>
    body {
      font-family: 'Source Code Pro', monospace;
      text-align: center;
      padding: 60px;
      background-color: #f7f9fc;
    }
    .receipt-container {
      background: #fff;
      border: 2px solid #2980b9;
      padding: 30px 50px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    h2 {
      color: #2980b9;
    }
    p {
      font-size: 18px;
      color: #333;
      margin: 10px 0;
    }
    button {
      margin-top: 20px;
      background: #2980b9;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1f5e85;
    }
    a button {
      background: #27ae60;
    }
    a button:hover {
      background: #1e8e4f;
    }
  </style>
</head>

<body>
  <div class="receipt-container">
    <h2>✅ Payment Successful</h2>
    <p>Thank you for shopping with <b>Apni Dukaan</b>!</p>
    <p><strong>Transaction ID:</strong> <span id="txnId"></span></p>
    <p><strong>Amount Paid:</strong> ₹41,000</p>

    <button onclick="window.print()">Download Receipt</button>
    <br><br>
    <a href="index.html"><button>Return to Home</button></a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('txnId').textContent = urlParams.get('payment_id') || 'N/A';
  </script>
</body>
</html>
