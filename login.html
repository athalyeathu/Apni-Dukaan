<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apni-Dukaan - Login</title>
  <link rel="stylesheet" type="text/css" href="./static/login.css">
  <script src="./static/login.js"></script>
  <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="login-container">
    <div class="login-form">
      <div class="form-section">
        <h1 class="welcome">Apni Dukaan</h1>
        <form id="loginForm">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" class="input" id="email" required>
          </div>
          <div class="input-group">
            <label for="pwd1">Password</label>
            <input type="password" class="input" id="pwd1" required>
          </div>
          <div class="forgot-password">
            <a href="forgotPassword.html" title="Forgot Password">Forgot Password?</a>
          </div>
          <button type="submit" class="button" onclick="return login()">Sign in!</button>
        </form>
      </div>
      <div class="welcome-section">
        <a href="./index.html" class="logo-link">
          <img class="logo" src="Images/ApniDukaanLogo.png" alt="Apni Dukaan Logo" />
        </a>
        <h2 class="back">Welcome back!</h2>
        <p class="log">Log in and use the opportunities offered by our portal.</p>
        <h3 class="acc">You don't have an account?</h3>
        <button class="signup" onclick="signup()">Sign Up!</button>
      </div>
    </div>
  </div>

  <script src="./static/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
