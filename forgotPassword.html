<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apni-Dukaan - Forgot Password</title>
  <link rel="stylesheet" type="text/css" href="./static/login.css">
  <link rel="icon" href="./Images/favicon.ico" type="image/x-icon">
</head>
<body>
  <div class="login-container">
    <div class="login-form">
      <div class="form-section">
        <h1 class="welcome">Forgot Password</h1>
        <p style="text-align: center; margin-bottom: 20px; color: var(--text-dark);">Enter your email to reset your password.</p>
        <form id="forgotForm">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" class="input" id="email" required>
          </div>
          <button type="submit" class="button">Reset Password</button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
          <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Back to Login</a>
        </div>
      </div>
      <div class="welcome-section">
        <a href="./index.html" class="logo-link">
          <img class="logo" src="Images/ApniDukaanLogo.png" alt="Apni Dukaan Logo" />
        </a>
        <h2 class="back">Reset Your Password</h2>
        <p class="log">We'll send you a link to reset your password.</p>
      </div>
    </div>
  </div>

  <script src="./static/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
